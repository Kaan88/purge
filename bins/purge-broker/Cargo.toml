[package]
name = "purge-broker"
description = "Purge elevated broker: the only release binary that links the executor"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
purge-engine = { path = "../purge-engine" }
purge-identity.workspace = true
purge-inventory.workspace = true
purge-model.workspace = true
purge-plan.workspace = true
purge-policy.workspace = true
purge-source.workspace = true
purge-exec.workspace = true
purge-guard.workspace = true
purge-harvest.workspace = true
# The MSI table cache's format, for the cache in the store's checked `fp\msitables` (msitables.rs).
purge-index.workspace = true
purge-rpc.workspace = true
purge-win = { workspace = true, features = ["write"] }
serde_json.workspace = true
# The consent dialog drawn with Purge's own toolkit (src/consent/toolkit; `--consent toolkit`). The
# toolkit and the two crates of it the dialog has to name; `xtask check-deps` rule 6 lists every
# crate this brings into the elevated binary and why.
mdshared-ui.workspace = true
mdshared-text.workspace = true
winit.workspace = true

[dev-dependencies]
purge-plan.workspace = true

[lints]
workspace = true
