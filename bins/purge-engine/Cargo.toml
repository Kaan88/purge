[package]
name = "purge-engine"
description = "Purge engine: stdio server, elevated broker and CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "purge_engine"
path = "src/lib.rs"

[features]
# Headless `exec` without the consent dialog, for the VM rig only (ENGINE_PLAN.md §3.4). Never in releases.
rig-exec = []

[dependencies]
purge-model.workspace = true
purge-win = { workspace = true, features = ["read", "run", "appx"] }
purge-source.workspace = true
purge-inventory.workspace = true
purge-identity.workspace = true
purge-harvest.workspace = true
purge-index.workspace = true
purge-scan.workspace = true
purge-guard.workspace = true
purge-policy.workspace = true
purge-plan.workspace = true
purge-exec.workspace = true
purge-kb.workspace = true
purge-rpc.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[lints]
workspace = true
