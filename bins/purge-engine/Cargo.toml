[package]
name = "purge-engine"
description = "Purge engine: stdio server, elevated broker and CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[lib]
name = "purge_engine"
path = "src/lib.rs"

[features]
# Headless `exec` without the consent dialog, for the VM rig only (ENGINE_PLAN.md §3.4). Never in releases.
# The executor is linked only with this feature: a normal build has no code path into purge-exec
# (`cargo xtask check-deps` enforces it).
rig-exec = ["dep:purge-exec", "purge-exec/fault-inject"]
# A developer build for trying the executor inside Sandboxie (docs/SANDBOX_TEST.md). Never in releases.
# On top of rig-exec: a relaxed store under %LOCALAPPDATA%\PurgeSandboxDev (or PURGE_SANDBOX_DEV_ROOT), no
# elevation needed, and every destructive verb refused unless the process runs inside Sandboxie. It is the
# only way to purge-exec's `test-support` outside tests (`cargo xtask check-deps` enforces it).
sandbox-dev = ["rig-exec", "purge-exec/test-support"]

[dependencies]
purge-model.workspace = true
purge-win = { workspace = true, features = ["read", "run", "appx"] }
purge-source.workspace = true
purge-inventory.workspace = true
purge-identity.workspace = true
purge-harvest.workspace = true
purge-index.workspace = true
purge-scan.workspace = true
purge-guard.workspace = true
purge-policy.workspace = true
purge-plan.workspace = true
purge-exec = { workspace = true, optional = true }
purge-kb.workspace = true
purge-rpc.workspace = true
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true

[dev-dependencies]
# The relaxed test store and the in-memory boot-move list for tests/exec_cli.rs (test builds only).
purge-exec = { workspace = true, features = ["test-support"] }
purge-win = { workspace = true, features = ["read", "write"] }

[lints]
workspace = true
