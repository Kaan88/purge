[package]
name = "purge-ui"
description = "Purge's window (Purge.exe), on the shared Rust toolkit mdshared-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "Purge"
path = "src/main.rs"

[dependencies]
mdshared-ui.workspace = true
mdshared-app.workspace = true
purge-client = { path = "../../crates/purge-client" }
purge-ui-model = { path = "../../crates/purge-ui-model" }
purge-rpc.workspace = true
purge-model.workspace = true
# The sample broker answers with the wire fixtures of purge-rpc (`sample_broker.rs`).
serde.workspace = true
serde_json.workspace = true
# The launch markers (process creation time, the precise clock, DwmFlush), the local time zone
# (the models' clock) and opening a web search (ShellExecuteW).
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_Time",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[lints]
workspace = true
