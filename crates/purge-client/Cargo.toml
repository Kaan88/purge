[package]
name = "purge-client"
description = "The UI's clients: the engine over stdio, the broker over its pipe, and a sample engine from fixtures"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
purge-model.workspace = true
purge-rpc.workspace = true
# `run`: the engine's start in a kill-on-close job and the broker's ShellExecuteExW("runas")
# (purge_win::launch). Never `write` (`cargo xtask check-deps`, rule 4f).
purge-win = { workspace = true, features = ["read", "run"] }
serde.workspace = true
serde_json.workspace = true
# Already in the tree through purge-model: the fingerprint file name is SHA-256 of the program id.
sha2.workspace = true
thiserror.workspace = true

[lints]
workspace = true
