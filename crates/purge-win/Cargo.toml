[package]
name = "purge-win"
description = "Thin Win32 wrappers: registry, filesystem, tokens, MSI, AppX, SCM, tasks, firewall, consent dialog"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
default = ["read"]
# Read-only system access, including the Toolhelp32 process snapshot and process image paths.
# Everything except the executor uses only this.
read = []
# Mutating operations (delete, move, registry writes, restore points). Only purge-exec enables it;
# purge-mcp may not depend on purge-win at all; `cargo xtask check-deps` enforces it.
write = ["read"]
# Process creation (CreateProcessW), Job objects and the MSI mutex probe for the uninstall runner
# (purge-inventory), and the UI's two starts (`launch`: the engine over stdio in a kill-on-close job,
# the broker through ShellExecuteExW "runas"). Not part of `read`.
run = ["read"]
# AppX package enumeration through WinRT.
appx = ["dep:windows"]
# COM-based system objects: Task Scheduler and firewall rules (WMI) through the `windows` crate.
com = ["dep:windows"]

[dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_System_Registry", "Win32_Storage_FileSystem", "Win32_Security", "Win32_Security_Cryptography", "Win32_Security_Authorization", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ApplicationInstallationAndServicing", "Win32_UI_Shell", "Win32_System_Com", "Win32_System_Environment", "Win32_System_SystemInformation", "Win32_System_IO", "Win32_System_Kernel", "Win32_Storage_Packaging_Appx", "Win32_System_Restore", "Win32_System_RestartManager", "Win32_System_WindowsProgramming", "Win32_System_Ioctl", "Win32_System_Services", "Win32_UI_Controls", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_Globalization", "Win32_System_EventLog", "Win32_Graphics_Gdi", "Win32_System_Console"] }
windows = { workspace = true, optional = true, features = ["Management_Deployment", "ApplicationModel", "Foundation_Collections", "Win32_System_TaskScheduler", "Win32_System_Com", "Win32_System_Ole", "Win32_System_Variant", "Win32_System_Wmi"] }
thiserror.workspace = true

[lints]
workspace = true
