[package]
name = "purge-rpc"
description = "NDJSON JSON-RPC 2.0 protocol and capability sets"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

# No purge-win, no purge-exec, no I/O handles, no threads: purge-mcp depends on this crate, and
# `cargo xtask check-deps` allows it only purge-model and purge-rpc (M3_DESIGN.md §6.1).
[dependencies]
purge-model.workspace = true
schemars.workspace = true
serde.workspace = true
serde_json = { workspace = true, features = ["raw_value"] }

