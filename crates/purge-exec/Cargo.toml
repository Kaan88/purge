[package]
name = "purge-exec"
description = "Executor: quarantine, registry backup, journal, typed inverses, undo"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Fault points (`PURGE_FAULT_AT`, `PURGE_FAULT_PAUSE`) for the VM rig. Enabled only by purge-engine's
# `rig-exec`; never in releases.
fault-inject = []
# Storage roots without the integrity checks, so tests run unelevated in temp dirs. Never in releases.
test-support = []

[dependencies]
purge-model.workspace = true
purge-win = { workspace = true, features = ["write", "appx", "com"] }
purge-guard.workspace = true
purge-plan.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
sha2.workspace = true

[dev-dependencies]
# The broker's caches' file names and formats, for the tests that drive `DocDir` with them
# (storage/tests.rs, "the caches' own names"; DECISIONS 2026-11-22, "baseline checked").
purge-index.workspace = true
purge-source.workspace = true

[lints]
workspace = true
