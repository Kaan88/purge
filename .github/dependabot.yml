version: 2
updates:
  - package-ecosystem: cargo
    directories:
      - "/"
      - "/vm/harness"
      - "/vm/rigtool"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      cargo-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: nuget
    directory: /ui/Purge.App
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      nuget-minor-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions-minor-patch:
        update-types:
          - "minor"
          - "patch"
